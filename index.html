<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>22-Day Cut Tracker</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:20px;background:#101319;color:#eee}section{background:#191e26;padding:16px;border-radius:12px;margin:12px 0}input,button{padding:10px;margin:4px;border-radius:8px}button{cursor:pointer}canvas{width:100%;background:#101319}</style></head><body><h1>22-Day Cut Tracker</h1><p>Sept 10 → Oct 2</p><section><h2>Quick check-in</h2><input id="w" type="number" step=".1" placeholder="Weight kg"><input id="c" type="number" placeholder="Calories"><input id="p" type="number" placeholder="Protein g"><input id="s" type="number" placeholder="Steps"><input id="a" type="number" placeholder="Drinks"><button onclick="add()">Save today</button><p id="msg"></p></section><section><h2>Progress</h2><div id="stats">115 kg start → 106 kg goal</div><canvas id="chart" height="220"></canvas></section><section><h2>History</h2><pre id="log"></pre></section><script>const K='cut-v3';let x=JSON.parse(localStorage.getItem(K)||'[]');function add(){let w=+document.querySelector('#w').value;if(!w)return; x.push({d:new Date().toISOString().slice(0,10),w,c:+c.value||0,p:+p.value||0,s:+s.value||0,a:+a.value||0});localStorage.setItem(K,JSON.stringify(x));render()}function render(){let last=x.at(-1);stats.textContent=last?`Current: ${last.w.toFixed(1)} kg | Lost: ${(115-last.w).toFixed(1)} kg | To 106: ${Math.max(0,last.w-106).toFixed(1)} kg`:'115 kg start → 106 kg goal';log.textContent=x.slice().reverse().map(z=>`${z.d}  ${z.w} kg | ${z.c} kcal | ${z.p}g protein | ${z.s} steps | ${z.a} drinks`).join('\n');let ctx=chart.getContext('2d');ctx.clearRect(0,0,900,220);if(x.length>1){let ys=x.map(z=>z.w),mi=Math.min(...ys)-1,ma=Math.max(...ys)+1;ctx.beginPath();ys.forEach((y,i)=>{let X=20+i*860/(ys.length-1),Y=20+(ma-y)/(ma-mi)*180;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke()}}render()</script></body></html>
